<style>
/* Layout: one narrow study column — header with language switch, tab rail, one working card per mode */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#17202B; --muted:#5A6576; --line:#D3D9E1;
  --ja:#2D4890; --ja-soft:#E2E8F6; --en:#0C7560; --en-soft:#DCF0EA; --on-accent:#FFFFFF;
  --good:#1D7F46; --good-soft:#E0F2E7; --bad:#B03A30; --bad-soft:#F8E4E1; --note:#8A5A00; --note-soft:#FBF0D9;
  --accent:var(--ja); --accent-soft:var(--ja-soft);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-en:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#19202A; --sunk:#141A22; --ink:#E5E9EF; --muted:#9AA5B5; --line:#2B3543;
  --ja:#93AAEA; --ja-soft:#1E2944; --en:#55C8A9; --en-soft:#123129; --on-accent:#0E141B;
  --good:#5CC98B; --good-soft:#15301F; --bad:#F2837A; --bad-soft:#3A1D1B; --note:#E8B95A; --note-soft:#33280F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#19202A; --sunk:#141A22; --ink:#E5E9EF; --muted:#9AA5B5; --line:#2B3543;
  --ja:#93AAEA; --ja-soft:#1E2944; --en:#55C8A9; --en-soft:#123129; --on-accent:#0E141B;
  --good:#5CC98B; --good-soft:#15301F; --bad:#F2837A; --bad-soft:#3A1D1B; --note:#E8B95A; --note-soft:#33280F;

body[data-lang="en"]{--accent:var(--en); --accent-soft:var(--en-soft)}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:15px; line-height:1.55; padding-inline:16px}
.wrap{max-width:680px; margin:0 auto; padding-block:20px 56px; display:flex; flex-direction:column; gap:16px}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.tl{font-family:var(--f-en)}
body[data-lang="ja"] .tl{font-family:var(--f-ja)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:10px}
.mark{width:36px; height:36px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-family:var(--f-ja); font-weight:700; font-size:18px; transition:background .25s}
.brand h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.1}
.brand p{margin:0; font-size:12px; color:var(--muted)}
.seg{display:inline-flex; background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:3px}
.seg button{border:0; background:transparent; padding:6px 14px; border-radius:7px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg .ja{font-family:var(--f-ja)} .seg .en{font-family:var(--f-en); font-size:16px}
.statline{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.statline b{color:var(--ink); font-weight:600}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:2px 9px; border-radius:99px; background:var(--sunk); border:1px solid var(--line); color:var(--muted)}
.pill i{width:7px; height:7px; border-radius:50%; background:var(--muted)}
.pill.cloud i{background:var(--good)} .pill.err i{background:var(--bad)}

/* tabs */
.tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none}
.tabs button{flex:0 0 auto; border:0; background:none; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:16px; min-width:0}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.between{justify-content:space-between}
.counts{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.counts b{color:var(--ink)}
.progress{height:4px; background:var(--sunk); border-radius:4px; overflow:hidden}
.progress span{display:block; height:100%; background:var(--accent); transition:width .3s}
.prompt{display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.big{font-size:clamp(28px,7.5vw,40px); line-height:1.25; font-weight:500; text-wrap:balance; word-break:keep-all; overflow-wrap:anywhere}
.mid{font-size:clamp(20px,5vw,24px); line-height:1.4; text-wrap:balance; word-break:keep-all; overflow-wrap:anywhere}
.rd{font-family:var(--f-ja); color:var(--muted); font-size:14px}
.tag{font-size:12px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent)}
.dots{display:inline-flex; gap:3px; vertical-align:middle}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--accent)}

.btn{border:1px solid transparent; background:var(--accent); color:var(--on-accent); font-weight:600; padding:10px 18px; border-radius:10px; transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:6px 12px; font-size:13px; border-radius:8px}
.link{border:0; background:none; padding:0; color:var(--accent); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px}
.icon-btn{border:1px solid var(--line); background:var(--surface); width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; color:var(--accent); flex:0 0 auto}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn svg{width:17px; height:17px}

.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:440px){.choices{grid-template-columns:1fr}}
.choice{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; min-height:56px; display:flex; flex-direction:column; justify-content:center; gap:2px; transition:border-color .15s, background .15s}
.choice:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.choice .k{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.choice.right{border-color:var(--good); background:var(--good-soft)}
.choice.wrong{border-color:var(--bad); background:var(--bad-soft)}
.choice:disabled{cursor:default}

.result{border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.result.ok{background:var(--good-soft)} .result.no{background:var(--bad-soft)}
.result .head{font-weight:700} .result.ok .head{color:var(--good)} .result.no .head{color:var(--bad)}
.example{display:flex; gap:10px; align-items:flex-start}
.example > div{min-width:0}

/* puzzle */
.answer{min-height:58px; border-bottom:2px dashed var(--line); padding-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start}
.bank{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 13px; font-size:18px; box-shadow:0 2px 0 var(--line); transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.chip.used{visibility:hidden}
.chip:disabled{cursor:default; transform:none}

/* expressions */
.flash{display:flex; flex-direction:column; gap:14px; align-items:flex-start}
.note{background:var(--note-soft); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:14px}
.note b{color:var(--note)}

/* lists + generate */
details.box{border:1px solid var(--line); border-radius:12px; background:var(--surface)}
details.box > summary{padding:12px 16px; font-weight:600; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:8px}
details.box > summary::-webkit-details-marker{display:none}
details.box > summary::after{content:"+"; color:var(--muted); font-weight:400}
details.box[open] > summary::after{content:"−"}
.boxbody{padding:0 16px 16px; display:flex; flex-direction:column; gap:10px}
ul.items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
ul.items li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:9px 0; border-top:1px solid var(--line)}
ul.items li .w{font-size:17px; overflow-wrap:anywhere}
ul.items li .m{grid-column:1; font-size:13px; color:var(--muted)}
ul.items li .side{grid-column:2; grid-row:1 / span 2; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
.mine{font-size:11px; color:var(--accent); font-weight:600}
input[type=text], textarea, select{background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:0}
input[type=text]{flex:1 1 180px}
.status{font-size:13px; color:var(--muted)}
.status.err{color:var(--bad)}

/* chat */
.scen{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
.scen button{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px}
.scen button:hover{border-color:var(--accent)}
.scen button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.scen b{font-size:15px} .scen span{font-size:12.5px; color:var(--muted)}
.msgs{display:flex; flex-direction:column; gap:14px; max-height:min(58vh,560px); overflow-y:auto; padding-right:4px}
.msg{display:flex; flex-direction:column; gap:6px; max-width:88%; min-width:0}
.msg.ai{align-self:flex-start} .msg.me{align-self:flex-end; align-items:flex-end}
.bubble{border-radius:14px; padding:10px 14px; overflow-wrap:anywhere}
.msg.ai .bubble{background:var(--sunk); border:1px solid var(--line); border-top-left-radius:4px}
.msg.me .bubble{background:var(--accent); color:var(--on-accent); border-top-right-radius:4px}
.msg.ai .bubble .tl{font-size:19px; line-height:1.5}
.msg .tools{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center}
.ko{font-size:14px; color:var(--muted)}
.fb{background:var(--note-soft); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; max-width:100%; text-align:left}
.fb .lbl{font-size:12px; font-weight:700; color:var(--note)}
.fb .tl{font-size:17px}
.typing{display:inline-flex; gap:4px; padding:14px}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hints{display:flex; flex-wrap:wrap; gap:6px}
.hints button{border:1px dashed var(--accent); background:transparent; color:var(--accent); border-radius:99px; padding:4px 12px; font-size:15px}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{flex:1; resize:none; min-height:46px; max-height:140px; font-size:16px}
.empty{color:var(--muted); text-align:center; padding:12px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>

/* ───────── helpers ───────── */
const $ = s => document.querySelector(s);
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null || v===false) continue;
    if(k==="class") n.className=v;
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(k==="value") n.value=v;
    else n.setAttribute(k, v===true ? "" : v);
  }
  for(const k of kids.flat(Infinity)){ if(k==null || k===false) continue; n.append(k instanceof Node ? k : String(k)); }
  return n;
}
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const canSpeak = "speechSynthesis" in window;
function speak(text, lang=S.lang){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG[lang].tts; u.rate = lang==="ja" ? .9 : .95;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-").toLowerCase().startsWith(u.lang.slice(0,2)));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch{}
}
function spk(text){
  if(!canSpeak || !text) return null;
  const b = el("button",{class:"icon-btn", type:"button", "aria-label":"발음 듣기", title:"발음 듣기", onclick:e=>{e.stopPropagation(); speak(text);}});
  b.innerHTML = SPK; return b;
}

/* ───────── items, SRS ───────── */
function prepSent(lang, s){
  if(lang==="en"){
    const m = s.s.trim().match(/^(.*?)([.?!])?$/);
    return {...s, tk:m[1].split(/\s+/), end:m[2]||".", full:s.s.trim()};
  }
  return {...s, full:s.tk.join("")+(s.end||"。")};
}
function pool(kind, lang=S.lang){
  const mine = (S.custom[lang][kind]||[]).map(x=>({...x, mine:true}));
  let all = [...mine, ...BASE[lang][kind]];
  if(kind==="sent") all = all.map(s=>prepSent(lang,s));
  return all;
}
const pkey = (kind,id) => kind[0]+":"+id;
function prog(kind,id,lang=S.lang){ return S.prog[lang][pkey(kind,id)]; }
function counts(kind){
  const now=Date.now(), items=pool(kind); let due=0, fresh=0, learned=0;
  for(const it of items){ const p=prog(kind,it.id); if(!p) fresh++; else { if(p.due<=now) due++; if(p.b>=4) learned++; } }
  return {due, fresh, learned, total:items.length};
}
function buildQueue(kind, size=10){
  const now=Date.now(), items=pool(kind);
  const P = it => prog(kind,it.id);
  const due = items.filter(it=>P(it) && P(it).due<=now).sort((a,b)=>P(a).due-P(b).due);
  const freshAll = items.filter(it=>!P(it));
  const fresh = [...shuffle(freshAll.filter(i=>i.mine)), ...shuffle(freshAll.filter(i=>!i.mine))];
  let q = [...due.slice(0,size), ...fresh].slice(0,size);
  if(q.length<size){
    const rest = items.filter(it=>!q.includes(it) && P(it)).sort((a,b)=>P(a).due-P(b).due);
    q = q.concat(rest.slice(0,size-q.length));
  }
  return shuffle(q);
}
function grade(kind, id, ok){
  const k=pkey(kind,id), P=S.prog[S.lang];
  const p = {...(P[k]||{b:0,due:0,n:0,ok:0})};
  p.n++;
  if(ok){ p.ok++; p.b=Math.min(p.b+1, IV.length-1); p.due=Date.now()+IV[p.b]*DAY-3600e3; }
  else { p.b=0; p.due=Date.now()+5*60e3; }
  P[k]=p; markDirty("progress-"+S.lang); bumpToday();
}
function bumpToday(){ const k=dkey(new Date()); S.stats.days[k]=(S.stats.days[k]||0)+1; markDirty("stats"); renderStats(); }
function streak(){
  const d=new Date(); let n=0;
  if(!S.stats.days[dkey(d)]) d.setDate(d.getDate()-1);
  while(S.stats.days[dkey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const KEYS = ["progress-ja","progress-en","custom-ja","custom-en","stats"];
const Store = { mode:"loading", db:null, uid:null, ready:false, blocked:new Set(),
  path(k){ return `data/users/${this.uid}/${k}`; },
  async load(k){
    if(this.mode==="cloud"){
      for(let t=0;t<2;t++){
        try{ const s=await this.db.doc(this.path(k)).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
        catch(e){ if(t===0) await new Promise(r=>setTimeout(r,600+Math.random()*600)); }
      }
      this.blocked.add(k); return null;
    }
    try{ const v=localStorage.getItem("harumal:"+k); return v ? JSON.parse(v) : null; }catch{ return null; }
  },
  async save(k, data){
    if(this.blocked.has(k)) return;
    if(this.mode==="cloud") return this.db.doc(this.path(k)).set(data);
    try{ localStorage.setItem("harumal:"+k, JSON.stringify(data)); }catch{}
  },
};
function dataFor(k){
  if(k==="stats") return S.stats;
  const [kind, lang] = k.split("-");
  return kind==="progress" ? {items:S.prog[lang]} : S.custom[lang];
}
const dirty = new Set(); let saveTimer=null, saving=false, saveErr=false;
function markDirty(k){ dirty.add(k); clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200); }
async function flush(){
  if(!Store.ready || saving){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,900); return; }
  saving=true; const keys=[...dirty]; dirty.clear();
  for(const k of keys){
    try{ await Store.save(k, dataFor(k)); saveErr=false; }
    catch(e){ saveErr=true; dirty.add(k); console.warn("save failed", k, e); }
  }
  saving=false; renderPill();

async function initStore(){

    const c=got["custom-"+lang]; if(c) for(const kind of ["vocab","expr","sent"]) if(Array.isArray(c[kind])) S.custom[lang][kind] = [...c[kind], ...S.custom[lang][kind].filter(x=>!c[kind].some(y=>y.id===x.id))];

async function generate(kind, topic){
  const lang=S.lang, key=lang+kind, L=LANG[lang];
  S.gen[key]={busy:true, msg:"Claude가 만드는 중이에요… (10~40초)"}; renderPanel();
  const sample = await getSample();
  if(!sample){ S.ai="off"; S.gen[key]={}; renderPanel(); return; }
  const t = topic || "everyday life";
  const known = pool(kind,lang).map(it=>it.w||it.t||it.full).slice(0,120).join(" / ");
  let prompt;
  if(kind==="vocab") prompt = lang==="ja"
    ? `Create 8 useful Japanese vocabulary items for a Korean native speaker (beginner to lower-intermediate) about the topic: "${t}". Prefer words used in real daily conversation. Do not repeat any of these: ${known}.\nReply with only a JSON array of objects:\n[{"w":"word as normally written (kanji if common)","r":"reading in hiragana","m":"short Korean meaning","ex":"short natural example sentence","exr":"the example in hiragana","exk":"Korean translation of the example"}]`
    : `Create 8 useful English words or phrasal verbs for a Korean native speaker (intermediate) about the topic: "${t}". Prefer words used in real daily conversation. Do not repeat any of these: ${known}.\nReply with only a JSON array of objects:\n[{"w":"word or phrase","m":"short Korean meaning","ex":"short natural example sentence","exk":"Korean translation of the example"}]`;
  else if(kind==="expr") prompt = `Create 6 natural, frequently used everyday ${L.en} expressions for a Korean native speaker about the situation: "${t}". Real spoken phrases people actually say, not textbook sentences. Do not repeat any of these: ${known}.\nReply with only a JSON array of objects:\n[{"t":"the ${L.en} expression"${lang==="ja"?`,"r":"reading in hiragana"`:""},"ko":"natural Korean equivalent","sit":"situation label in Korean, 2-6 characters","note":"one short usage tip in Korean, or empty string"}]`;
  else prompt = lang==="ja"
    ? `Create 5 Japanese sentence-building exercises for a Korean native speaker (beginner) about the topic: "${t}". Each sentence is short and natural.\nReply with only a JSON array of objects:\n[{"ko":"Korean sentence","tk":["the Japanese sentence split into 3-8 chunks in correct order: words and particles as separate chunks, no final punctuation"],"x":["2 plausible wrong chunks"],"end":"。 or ？","r":"the full sentence in hiragana"}]`
    : `Create 5 English sentence-building exercises for a Korean native speaker (intermediate) about the topic: "${t}". Each sentence is natural spoken English, 5-11 words.\nReply with only a JSON array of objects:\n[{"ko":"Korean sentence","s":"the English sentence with final punctuation","x":["2 plausible wrong words that a Korean learner might confuse"]}]`;
  try{
    const arr = await sample.json(prompt, {cache:false});
    if(!Array.isArray(arr)) throw {code:"invalid_json"};
    const stamp = Date.now().toString(36); const str = v => typeof v==="string" ? v.trim() : "";
    const ok = arr.map((o,i)=>{
      if(!o || typeof o!=="object") return null;
      const id = "c"+stamp+i;
      if(kind==="vocab"){ const it={id, w:str(o.w), m:str(o.m), ex:str(o.ex), exk:str(o.exk)}; if(lang==="ja"){ it.r=str(o.r); it.exr=str(o.exr); } return it.w&&it.m ? it : null; }
      if(kind==="expr"){ const it={id, t:str(o.t), ko:str(o.ko), sit:str(o.sit)||"AI", note:str(o.note)}; if(lang==="ja") it.r=str(o.r); return it.t&&it.ko ? it : null; }
      if(lang==="ja"){ const tk=Array.isArray(o.tk)?o.tk.map(str).filter(Boolean):[]; const x=Array.isArray(o.x)?o.x.map(str).filter(Boolean).slice(0,3):[];
        return str(o.ko)&&tk.length>=2 ? {id, ko:str(o.ko), tk, x, end:str(o.end)||"。", r:str(o.r)} : null; }
      const x=Array.isArray(o.x)?o.x.map(str).filter(Boolean).slice(0,3):[];
      return str(o.ko)&&str(o.s) ? {id, ko:str(o.ko), s:str(o.s), x} : null;
    }).filter(Boolean);
    const have = new Set(pool(kind,lang).map(it=>it.w||it.t||it.full));
    const fresh = ok.filter(it=>!have.has(it.w||it.t||(it.s||"")));
    S.custom[lang][kind] = [...fresh, ...S.custom[lang][kind]];
    markDirty("custom-"+lang);
    S.sess[lang][kind] = null;
    S.gen[key] = {msg: fresh.length ? `새 ${GEN_LABEL[kind]} ${fresh.length}개를 추가했어요. 지금 세트에 먼저 나와요.` : "겹치지 않는 항목이 없었어요. 다른 주제로 해 보세요."};
  }catch(e){
    S.gen[key] = {msg:aiErr(e), err:true};
  }
  renderPanel();
}

function checkSent(){
  const s=S.sess[S.lang].sent, it=s.queue[s.i], st=s.st;
  const mine = st.picked.map(k=>st.bank.find(b=>b.k===k).t);
  const norm = a => S.lang==="en" ? a.join(" ").toLowerCase().replace(/[.,?!]/g,"").replace(/\s+/g," ").trim() : a.join("").replace(/[、。？]/g,"");
  st.checked = norm(mine)===norm(it.tk);
  if(st.checked) s.right++;
  grade("sent", it.id, st.checked);
  renderPanel(); $("#next-btn")?.focus();
  if(st.checked) speak(it.full);
}

function chatRules(lang, sc, lv){
  const L=LANG[lang].en, ja=lang==="ja";
  return `You are a conversation partner helping a Korean native speaker practice spoken ${L}.
Scenario: ${sc.p}
Learner level: ${LEVELS[lv].p}.
Rules:
- Stay in character. "reply" is only ${L}: 1-2 short, natural spoken sentences at the learner's level${ja?", polite です/ます form unless the scenario says casual":""}. Usually end with something the learner can answer.
- Check the learner's latest message. If it has a mistake or sounds unnatural, set "feedback" to {"fixed": a natural ${L} version, ${ja?`"reading": fixed in hiragana, `:""}"ko": its Korean meaning, "why": one or two short sentences in Korean explaining the point}. If the learner wrote Korean (or mixed Korean), "fixed" is the natural ${L} way to say it, and then reply as if they had said it. If the message is already natural, "feedback" is null. Ignore punctuation and small typos.
- "hints": 2-3 short things the learner could say next, in ${L}, at their level.
Reply with only one JSON object and nothing else:
{"reply":"...",${ja?`"reading":"reply in hiragana and katakana only",`:""}"ko":"Korean translation of reply","feedback":null,"hints":["...","..."]}`;
}
function chatState(){ return S.chat[S.lang]; }
function startChat(){
  const lang=S.lang, pk=S.pick[lang], sc=SCEN[lang].find(x=>x.id===pk.sc);
  S.chat[lang] = {sc, lv:pk.lv, turns:[{role:"user", content:"(Start the conversation now with your opening line. The learner has not spoken yet, so feedback is null.)"}], msgs:[], hints:[], busy:false, ctl:null, draft:"", err:""};
  renderPanel(); chatCall();
}
async function chatCall(){
  const lang=S.lang, c=S.chat[lang]; if(!c || c.busy) return;
  c.busy=true; c.err=""; renderPanel();
  const sample = await getSample();
  if(!sample){ S.ai="off"; c.busy=false; renderPanel(); return; }
  const ctl = new AbortController(); c.ctl=ctl;
  const turns = [{role:"user", content:chatRules(lang, c.sc, c.lv)}, ...c.turns.slice(-24)];
  try{
    const res = await sample.json(turns, {cache:false, modelTier:S.accurate?"default":"quick", signal:ctl.signal});
    if(!res || typeof res.reply!=="string" || !res.reply.trim()) throw {code:"invalid_json"};
    const str = v => typeof v==="string" ? v.trim() : "";
    c.turns.push({role:"assistant", content:JSON.stringify(res)});
    const fb = res.feedback && typeof res.feedback==="object" && str(res.feedback.fixed) ? {fixed:str(res.feedback.fixed), reading:str(res.feedback.reading), ko:str(res.feedback.ko), why:str(res.feedback.why)} : null;
    const lastMe = [...c.msgs].reverse().find(m=>m.who==="me");
    if(lastMe && !lastMe.answered){ lastMe.fb=fb; lastMe.answered=true; }
    c.msgs.push({who:"ai", text:str(res.reply), reading:str(res.reading), ko:str(res.ko), showKo:false});
    c.hints = Array.isArray(res.hints) ? res.hints.map(str).filter(Boolean).slice(0,3) : [];
    if(S.lang===lang && S.tab==="chat") setTimeout(()=>speakIfAuto(str(res.reply)), 0);
  }catch(e){
    if(!e || e.code!=="cancelled") c.err = aiErr(e);
  }finally{
    c.busy=false; c.ctl=null;
    if(S.lang===lang && S.tab==="chat"){ renderPanel(); $("#chat-input")?.focus(); }
  }
}
function speakIfAuto(t){ if(S.autoSpeak) speak(t); }
function sendChat(){
  const c=chatState(); if(!c || c.busy) return;
  const text=(c.draft||"").trim(); if(!text) return;
  c.turns.push({role:"user", content:text}); c.msgs.push({who:"me", text}); c.draft=""; c.hints=[];
  bumpToday(); chatCall();
}
function savedExpr(t){ return S.custom[S.lang].expr.some(x=>x.t===t); }
function saveExpr(it){
  if(savedExpr(it.t)) return;
  S.custom[S.lang].expr.unshift({id:"c"+Date.now().toString(36), t:it.t, r:it.r||"", ko:it.ko||"", sit:"회화에서", note:it.note||""});
  markDirty("custom-"+S.lang); S.sess[S.lang].expr=null; renderPanel();
}
function saveBtn(it){
  const done = savedExpr(it.t);
  return el("button",{class:"link", disabled:done||null, style:done?"color:var(--muted);text-decoration:none":null, onclick:()=>saveExpr(it)}, done?"표현에 저장됨":"표현에 저장");
}
function renderChat(){
  const lang=S.lang, c=chatState(), wrap=el("div",{style:"display:flex;flex-direction:column;gap:12px"});
  if(S.ai==="off"){
    wrap.append(el("div",{class:"card"}, el("div",{class:"mid"},"AI 회화를 쓸 수 없어요"),
      el("p",{class:"muted", style:"margin:0"},"AI 회화는 claude.ai에서 이 페이지를 열고 Claude 사용을 허용해야 동작해요. 허용하지 않았다면 페이지의 권한 메뉴에서 바꿀 수 있어요. 단어, 표현, 문장 조립은 그대로 쓸 수 있어요.")));
    return wrap;
  }
  if(!c){
    const pk=S.pick[lang];
    wrap.append(el("div",{class:"card"},
      el("div",{class:"prompt"}, el("span",{class:"tag"},"상황 고르기"), el("div",{class:"mid"},`누구와 ${LANG[lang].ko}로 이야기할까요?`)),
      el("div",{class:"scen"}, SCEN[lang].map(sc=>el("button",{"aria-pressed":pk.sc===sc.id, onclick:()=>{pk.sc=sc.id; renderPanel();}}, el("b",null,sc.t), el("span",null,sc.d)))),
      el("div",{class:"row between"},
        el("div",{class:"seg", role:"group", "aria-label":"난이도"}, LEVELS.map((L,i)=>el("button",{"aria-pressed":pk.lv===i, onclick:()=>{pk.lv=i; renderPanel();}}, L.t))),
        el("button",{class:"btn", onclick:startChat},"대화 시작")),
      el("div",{class:"small muted"},
        "막히면 한국어로 써도 돼요. 자연스러운 ", LANG[lang].ko, " 문장으로 고쳐 주고, 고친 문장은 ‘일상 표현’ 복습 카드로 저장할 수 있어요."),
      el("label",{class:"small muted row", style:"gap:6px"}, el("input",{type:"checkbox", id:"opt-accurate", checked:S.accurate||null, onchange:e=>{S.accurate=e.target.checked; savePrefs();}}),
        "교정 정확도 우선 (답이 느려져요)")));
    return wrap;
  }
  const msgs = el("div",{class:"msgs", "aria-live":"polite"},
    c.msgs.map(m=>{
      if(m.who==="ai") return el("div",{class:"msg ai"},
        el("div",{class:"bubble"}, el("div",{class:"tl"}, m.text),
          lang==="ja" && S.showReading && m.reading ? el("div",{class:"rd"}, m.reading) : null,
          m.showKo ? el("div",{class:"ko"}, m.ko) : null),
        el("div",{class:"tools"}, spk(m.text),
          el("button",{class:"link", onclick:()=>{m.showKo=!m.showKo; renderPanel();}}, m.showKo?"번역 숨기기":"번역 보기"),
          saveBtn({t:m.text, r:m.reading, ko:m.ko})));
      return el("div",{class:"msg me"}, el("div",{class:"bubble"}, m.text),
        m.fb ? el("div",{class:"fb"},
          el("span",{class:"lbl"},"이렇게 말하면 더 자연스러워요"),
          el("div",{class:"row", style:"gap:8px"}, el("span",{class:"tl"}, m.fb.fixed), spk(m.fb.fixed)),
          lang==="ja" && m.fb.reading ? el("div",{class:"rd"}, m.fb.reading) : null,
          m.fb.why ? el("div",{class:"small"}, m.fb.why) : null,
          el("div",null, saveBtn({t:m.fb.fixed, r:m.fb.reading, ko:m.fb.ko, note:m.fb.why}))) : null);
    }),
    c.busy ? el("div",{class:"msg ai"}, el("div",{class:"bubble typing", "aria-label":"답장을 쓰는 중"}, el("i"),el("i"),el("i"))) : null,
    c.err ? el("div",{class:"result no"}, el("div",null,c.err), el("div",null, el("button",{class:"btn sm ghost", onclick:chatCall},"다시 시도"))) : null);
  const ta = el("textarea",{id:"chat-input", rows:"1", placeholder:`${LANG[lang].ko}로 답해 보세요 (한국어도 괜찮아요)`, value:c.draft,
    oninput:e=>{ c.draft=e.target.value; e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"; },
    onkeydown:e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); sendChat(); } }});
  wrap.append(el("div",{class:"card"},
    el("div",{class:"row between"},
      el("div",{class:"row"}, el("span",{class:"tag"}, c.sc.t), el("span",{class:"small muted"}, LEVELS[c.lv].t)),
      el("div",{class:"row"},
        lang==="ja" ? el("label",{class:"small muted row", style:"gap:6px"}, el("input",{type:"checkbox", id:"chat-reading", checked:S.showReading||null, onchange:e=>{S.showReading=e.target.checked; savePrefs(); renderPanel();}}),"읽는 법") : null,
        canSpeak ? el("label",{class:"small muted row", style:"gap:6px"}, el("input",{type:"checkbox", id:"chat-auto", checked:S.autoSpeak||null, onchange:e=>{S.autoSpeak=e.target.checked;}}),"자동 읽기") : null,
        el("button",{class:"btn ghost sm", onclick:()=>{ c.ctl?.abort(); S.chat[lang]=null; renderPanel(); }},"대화 끝내기"))),
    msgs,
    c.hints.length && !c.busy ? el("div",{class:"hints"}, el("span",{class:"small muted", style:"align-self:center"},"이렇게 말해 볼까요?"),
      c.hints.map(h=>el("button",{class:"tl", onclick:()=>{ c.draft=h; renderPanel(); const t=$("#chat-input"); t.focus(); t.setSelectionRange(h.length,h.length); }}, h))) : null,
    el("div",{class:"composer"}, ta,
      c.busy ? el("button",{class:"btn ghost", onclick:()=>c.ctl?.abort()},"멈추기")
             : el("button",{class:"btn", onclick:sendChat},"보내기"))));
  return wrap;
}

/* ───────── wiring ───────── */
$("#lang-ja").onclick = ()=>{ S.lang="ja"; savePrefs(); render(); };
$("#lang-en").onclick = ()=>{ S.lang="en"; savePrefs(); render(); };
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; savePrefs(); render(); });
document.addEventListener("keydown", e=>{
  if(S.tab!=="vocab" || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  const s=S.sess[S.lang].vocab; if(!s || !s.st) return;
  if(!s.st.chosen && /^[1-4]$/.test(e.key)){ const c=s.st.choices[+e.key-1]; if(c) answerVocab(c.id); }
});
if(canSpeak) try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch{}
render(); renderPill();
initStore();
getSample().then(s=>{ const was=S.ai; S.ai = s ? (S.ai==="off"?"off":"on") : "off"; if(was!==S.ai && !(S.tab==="chat" && chatState())) renderPanel(); });
</script>
